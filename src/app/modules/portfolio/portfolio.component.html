<div>
    <div class="header flex flex-row items-stretch">
        <div class="profile basis-1/5 flex justify-start">
            <img src="https://media.licdn.com/dms/image/v2/D4D03AQHSV5q_lhu_Rg/profile-displayphoto-shrink_800_800/profile-displayphoto-shrink_800_800/0/1730824563744?e=1741219200&v=beta&t=CyQYZ4GlTqomh9WH8Idt5LPoSem8m3I11Gi8ZoEDkvI" alt="">
        </div>
        <div class="presentation basis-3/5 flex flex-col items-center">
            <p class="title-1">Marcelo A. Iglesias</p>
            <p class="subtitle-1">{{getText('role')}}</p>
        </div>
        <div class="config basis-1/5 flex justify-between">
            <div class="language flex items-center">
                <select name="lang" id="lang" #lang (change)="changeLang(lang.value)" class="selector text-primary-light dark:text-primary-dark bg-white dark:bg-black">
                    <option value="english">English</option>
                    <option value="spanish">Español</option>
                </select>
            </div>
            <div class="theme flex items-center">
                <div class="theme-button" (click)="changeTheme()">
                    <svg *ngIf="darkTheme; else moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="size-6 fill-primary-dark">
                        <path d="M12 2.25a.75.75 0 0 1 .75.75v2.25a.75.75 0 0 1-1.5 0V3a.75.75 0 0 1 .75-.75ZM7.5 12a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM18.894 6.166a.75.75 0 0 0-1.06-1.06l-1.591 1.59a.75.75 0 1 0 1.06 1.061l1.591-1.59ZM21.75 12a.75.75 0 0 1-.75.75h-2.25a.75.75 0 0 1 0-1.5H21a.75.75 0 0 1 .75.75ZM17.834 18.894a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 1 0-1.061 1.06l1.59 1.591ZM12 18a.75.75 0 0 1 .75.75V21a.75.75 0 0 1-1.5 0v-2.25A.75.75 0 0 1 12 18ZM7.758 17.303a.75.75 0 0 0-1.061-1.06l-1.591 1.59a.75.75 0 0 0 1.06 1.061l1.591-1.59ZM6 12a.75.75 0 0 1-.75.75H3a.75.75 0 0 1 0-1.5h2.25A.75.75 0 0 1 6 12ZM6.697 7.757a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 0 0-1.061 1.06l1.59 1.591Z" />
                    </svg>
                    <ng-template #moon>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="size-6 fill-primary-light">
                            <path fill-rule="evenodd" d="M9.528 1.718a.75.75 0 0 1 .162.819A8.97 8.97 0 0 0 9 6a9 9 0 0 0 9 9 8.97 8.97 0 0 0 3.463-.69.75.75 0 0 1 .981.98 10.503 10.503 0 0 1-9.694 6.46c-5.799 0-10.5-4.7-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 0 1 .818.162Z" clip-rule="evenodd" />
                        </svg>                      
                    </ng-template>
                </div>
            </div>
        </div>
    </div>

    <div class="body text-primary-light dark:text-primary-dark">
        <div class="grid grid-cols-2 gap-2 h-5/6">
            <div class="basis-1/2 flex flex-col m-2 p-2 w-full dark:bg-[#0d0d0df0] bg-[#f0f0f0f0] rounded justify-between" *ngFor="let exp of experience">
                <div class="w-full flex flex-col items-start">
                    <div class="w-full flex justify-between">
                        <p class="title-2">{{getText(exp.title)}}</p>
                        <p class="subtitle-1">{{getDateStr(exp.start_date) + " - " + getDateStr(exp.end_date)}}</p>
                    </div>
                    <p class="subtitle-1">{{exp.company}}</p>
                    <div class="p-4">
                        <p>Tasks</p>
                    </div>
                </div>
                <!-- <div class="grid grid-cols-8 gap-2 p-2 justify-items-center"> -->
                    <app-carrousel [technologies]="exp.technologies"></app-carrousel>
                    <!-- <div *ngFor="let tec of getCarrousel(exp.tecnologies);" class="h-10 w-10 basis-1/8 flex justify-center">
                        <img [src]="tec.logo" class="h-full"/>
                    </div> -->
                <!-- </div> -->
            </div>
        </div>
        <div class="paginator h-1/6">
            <mat-paginator class="bg-white dark:bg-black" [length]="count_experience"
                  [pageSize]="2"
                  [hidePageSize]="true"
                  (page)="handlePageEvent($event)"
                  aria-label="Select page">
                </mat-paginator>
        </div>
    </div>

    <div class="footer">
        <div class="grid grid-cols-2 gap-2">
            <div class="contact text-primary-light dark:text-primary-dark">
